services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: muscle
      POSTGRES_PASSWORD: muscle
      POSTGRES_DB: muscle_power
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muscle -d muscle_power"]
      interval: 5s
      timeout: 5s
      retries: 8

volumes:
  pgdata:
